services:
  # Build server + migrate locally from vendor/crikket source so code edits are consumed.
  # Web stays on the pre-built upstream image (amd64 under Rosetta) — unrelated to the
  # GitHub-forwarding feature we're working on.
  server:
    image: crikket-server:local
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    pull_policy: build
    platform: ""
    environment:
      # Browser-facing endpoint used for pre-signed URLs; server still reaches
      # MinIO via STORAGE_ENDPOINT (http://minio:9000).
      STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
  migrate:
    image: crikket-server:local
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    pull_policy: build
    platform: ""
  web:
    # Dev-mode: run `next dev` against a bind-mounted source tree. Avoids the
    # ~4GB memory pressure of `next build` under Bun (which OOMs on a stock
    # Docker Desktop) and enables hot-reload for frontend iteration.
    image: oven/bun:1.3.5-alpine
    pull_policy: missing
    platform: ""
    entrypoint: []
    working_dir: /app
    command: >-
      sh -c "
      cd /app &&
      bun install --frozen-lockfile &&
      bun run build -- --filter='web^...' &&
      cd /app/apps/web &&
      bun run dev -- --hostname 0.0.0.0
      "
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_SITE_URL: http://localhost:3001
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      NEXT_PUBLIC_GOOGLE_AUTH_ENABLED: "false"
      NEXT_PUBLIC_CRIKKET_KEY: ""
    volumes:
      - .:/app
      - crikket_web_node_modules:/app/node_modules
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --tries=1 --spider http://localhost:3001/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s

  minio:
    image: minio/minio:latest
    container_name: crikket-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: crikket
      MINIO_ROOT_PASSWORD: crikketminio
      # Crikket's capture SDK PUTs bug-report artifacts directly to MinIO via
      # presigned URLs from whatever origin the host app runs at (Vite on
      # :5173, the Crikket dashboard on :3001, etc). The preflight fails
      # without an explicit allowlist, producing "Direct upload to storage
      # failed. Check storage CORS or network access, then retry." in the
      # capture widget. `*` matches the dev-only posture of this stack.
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: crikket-minio-init
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 crikket crikketminio &&
      mc mb --ignore-existing local/crikket &&
      mc anonymous set download local/crikket &&
      echo 'MinIO bucket ready'
      "

volumes:
  minio_data:
  crikket_web_node_modules:
